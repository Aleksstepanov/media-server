version: '3.8'

services:
  navidrome:
    build: .
    container_name: navidrome
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: your_access_key
      S3_SECRET_KEY: your_secret_key
      S3_BUCKET: cb4f3c27-b7b96197-61cf-4ffe-9dbe-ec7a7d596aad
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data:/app/data
    ports:
      - "4533:4533"
